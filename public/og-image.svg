<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="canvasBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="55%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#canvasBg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Subtle glowing accent orb -->
  <circle cx="920" cy="315" r="290" fill="rgba(56, 189, 248, 0.08)" />

  <!-- Left Editorial Typography Column -->
  <g transform="translate(84, 118)">
    <!-- Brand Kicker -->
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#38BDF8" />
    <line x1="6" y1="16" x2="38" y2="16" stroke="#0F172A" stroke-width="3" stroke-dasharray="5 4" />
    <line x1="6" y1="28" x2="38" y2="28" stroke="#0F172A" stroke-width="3" stroke-dasharray="5 4" />
    <text x="60" y="30" fill="#38BDF8" font-family="'Plus Jakarta Sans', 'Noto Sans JP', sans-serif" font-size="24" font-weight="700" letter-spacing="0.04em">
      SplitLine Studio
    </text>

    <!-- Main Headline -->
    <text x="0" y="116" fill="#F8FAFC" font-family="'Plus Jakarta Sans', 'Noto Sans JP', sans-serif" font-size="54" font-weight="800">
      JPG / PNG 画像
    </text>
    <text x="0" y="186" fill="#F8FAFC" font-family="'Plus Jakarta Sans', 'Noto Sans JP', sans-serif" font-size="54" font-weight="800">
      縦n分割スタジオ
    </text>

    <!-- Description -->
    <text x="0" y="246" fill="#94A3B8" font-family="'Noto Sans JP', sans-serif" font-size="22" font-weight="500">
      スライダー・数値入力で2〜50分割を自在に指定。
    </text>
    <text x="0" y="282" fill="#94A3B8" font-family="'Noto Sans JP', sans-serif" font-size="22" font-weight="500">
      分割前プレビュー・ピース間隔(Gap)調整・ZIP一括保存。
    </text>

    <!-- Feature Metadata Strip -->
    <g transform="translate(0, 344)">
      <rect x="0" y="0" width="540" height="52" rx="10" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1.5" />
      <circle cx="26" cy="26" r="6" fill="#10B981" />
      <text x="44" y="32" fill="#E2E8F0" font-family="'JetBrains Mono', 'Noto Sans JP', monospace" font-size="18" font-weight="600">
        100% ブラウザ内処理 · サーバー送信なし · 無料
      </text>
    </g>
  </g>

  <!-- Right Visual Showcase: 4-Split Vertical Poster with Gap & Cut Lines -->
  <g transform="translate(700, 68)">
    <!-- Outer Frame -->
    <rect x="-20" y="-20" width="436" height="534" rx="20" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="2" />

    <!-- Slice #01 -->
    <g transform="translate(0, 0)">
      <rect width="396" height="106" rx="10" fill="#FFFFFF" />
      <rect x="16" y="16" width="84" height="24" rx="5" fill="#0F172A" />
      <text x="26" y="33" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">#01 · 25%</text>
      <rect x="116" y="20" width="190" height="14" rx="7" fill="#0EA5E9" />
      <rect x="16" y="54" width="340" height="12" rx="6" fill="#CBD5E1" />
      <rect x="16" y="76" width="240" height="12" rx="6" fill="#E2E8F0" />
      <text x="312" y="33" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">1200×450</text>
    </g>

    <!-- Cut Line #1 + Gap Indicator -->
    <line x1="-28" y1="117" x2="424" y2="117" stroke="#F43F5E" stroke-width="3" stroke-dasharray="10 7" />
    <rect x="308" y="105" width="112" height="24" rx="5" fill="#E11D48" />
    <text x="320" y="121" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">CUT #1 · 450px</text>

    <!-- Slice #02 -->
    <g transform="translate(0, 128)">
      <rect width="396" height="106" rx="10" fill="#FFFFFF" />
      <rect x="16" y="16" width="84" height="24" rx="5" fill="#0F172A" />
      <text x="26" y="33" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">#02 · 25%</text>
      <rect x="116" y="20" width="170" height="14" rx="7" fill="#F59E0B" />
      <rect x="16" y="54" width="320" height="12" rx="6" fill="#CBD5E1" />
      <rect x="16" y="76" width="270" height="12" rx="6" fill="#E2E8F0" />
      <text x="312" y="33" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">1200×450</text>
    </g>

    <!-- Cut Line #2 + Gap Indicator -->
    <line x1="-28" y1="245" x2="424" y2="245" stroke="#38BDF8" stroke-width="3" stroke-dasharray="10 7" />
    <rect x="308" y="233" width="112" height="24" rx="5" fill="#0284C7" />
    <text x="320" y="249" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">GAP · 16px</text>

    <!-- Slice #03 -->
    <g transform="translate(0, 256)">
      <rect width="396" height="106" rx="10" fill="#FFFFFF" />
      <rect x="16" y="16" width="84" height="24" rx="5" fill="#0F172A" />
      <text x="26" y="33" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">#03 · 25%</text>
      <rect x="116" y="20" width="175" height="14" rx="7" fill="#10B981" />
      <rect x="16" y="54" width="350" height="12" rx="6" fill="#CBD5E1" />
      <rect x="16" y="76" width="210" height="12" rx="6" fill="#E2E8F0" />
      <text x="312" y="33" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">1200×450</text>
    </g>

    <!-- Cut Line #3 -->
    <line x1="-28" y1="373" x2="424" y2="373" stroke="#F43F5E" stroke-width="3" stroke-dasharray="10 7" />
    <rect x="304" y="361" width="116" height="24" rx="5" fill="#E11D48" />
    <text x="314" y="377" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">CUT #3 · 1350px</text>

    <!-- Slice #04 -->
    <g transform="translate(0, 384)">
      <rect width="396" height="106" rx="10" fill="#FFFFFF" />
      <rect x="16" y="16" width="84" height="24" rx="5" fill="#0F172A" />
      <text x="26" y="33" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">#04 · 25%</text>
      <rect x="116" y="20" width="160" height="14" rx="7" fill="#F43F5E" />
      <rect x="16" y="54" width="310" height="12" rx="6" fill="#CBD5E1" />
      <rect x="16" y="76" width="250" height="12" rx="6" fill="#E2E8F0" />
      <text x="312" y="33" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">1200×450</text>
    </g>
  </g>
</svg>
